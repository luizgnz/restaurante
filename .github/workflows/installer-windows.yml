name: instalador-windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # El instalador ejecuta el backend Go. Las dependencias nativas del
      # backend Node legado no deben compilarse en el runner de Windows.
      - run: npm ci --ignore-scripts
      - run: choco install innosetup --yes --no-progress
      - name: Compilar instalador
        shell: pwsh
        env:
          RESTAURANTE_VERSION: ${{ github.event_name == 'pull_request' && format('0.1.0-pr{0}', github.event.pull_request.number) || github.ref_name }}
        run: npm run build:windows
      - name: Probar primera instalación y arranque en Windows
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'installer/windows/stage/restaurante.exe'
          $ui = Join-Path $PWD 'installer/windows/stage/ui'
          $migrations = Join-Path $PWD 'installer/windows/stage/migrations'
          $data = Join-Path $env:RUNNER_TEMP 'Restaurante smoke'
          $log = Join-Path $data 'logs/smoke.log'
          & $exe -verify-install -ui-dir $ui -migrations-dir $migrations -data-dir $data -log-file $log
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw 'El binario Windows no validó una base nueva.'
          }
          if (-not (Test-Path (Join-Path $data 'data/salon.sqlite'))) {
            throw 'No se creó la base de datos inicial.'
          }
          $arguments = '-no-browser -listen 127.0.0.1:18080 -ui-dir "{0}" -migrations-dir "{1}" -data-dir "{2}" -log-file "{3}"' -f $ui, $migrations, $data, $log
          $server = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18080/api/salud' -TimeoutSec 2
                if ($health.ok -eq $true -and $health.runtime -eq 'go') {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) { throw 'El servidor no respondió al chequeo de salud.' }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:18080/' -UseBasicParsing -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<html') {
              throw 'La interfaz no se entregó correctamente.'
            }
          } catch {
            if (Test-Path $log) { Get-Content $log }
            throw
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Instalar paquete completo y comprobar tarea local
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'installer/windows/output/Restaurante-Setup-*-x64.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $setup) { throw 'No se generó Setup.exe.' }
          $setupLog = Join-Path $env:RUNNER_TEMP 'restaurante-setup.log'
          $setupProcess = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$setupLog") -PassThru -Wait
          $setupExitCode = $setupProcess.ExitCode
          $installDir = Join-Path $env:ProgramFiles 'Restaurante'
          $dataDir = Join-Path $env:ProgramData 'Restaurante'
          if ($setupExitCode -ne 0) {
            Write-Host "Setup terminó con código $setupExitCode"
            Get-ChildItem 'installer/windows/output' | Select-Object Name, Length | Format-Table
            if (Test-Path $setupLog) { Get-Content $setupLog | Select-Object -Last 100 }
            Get-ChildItem $env:TEMP -Filter 'Setup Log*' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 100 }
            Get-ChildItem (Join-Path $dataDir 'logs') -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 50 }
            throw 'La primera instalación completa falló.'
          }
          if (-not (Test-Path (Join-Path $installDir 'install-success.marker'))) {
            throw 'La instalación no registró su finalización.'
          }
          if (-not (Test-Path (Join-Path $dataDir 'data/salon.sqlite'))) {
            throw 'El instalador no creó la base de datos.'
          }
          if (Test-Path (Join-Path $dataDir 'backups/updates/active-backup.txt')) {
            throw 'Una instalación inicial intentó respaldar una instalación anterior.'
          }
          if (-not (Get-ScheduledTask -TaskName 'Restaurante POS' -ErrorAction SilentlyContinue)) {
            throw 'El instalador no registró la tarea de inicio.'
          }
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/salud' -TimeoutSec 5
          if ($health.ok -ne $true -or $health.runtime -ne 'go') {
            throw 'El servidor instalado no está disponible.'
          }
          $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/' -UseBasicParsing -TimeoutSec 5
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<html') {
            throw 'La interfaz instalada no está disponible.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Restaurante-Setup-${{ github.run_id }}-x64
          # UseSetupLdr=no genera Setup.exe y uno o más Setup-*.bin. Todos son
          # obligatorios para evitar ejecutar el motor desde %TEMP%.
          path: installer/windows/output/*
          if-no-files-found: error
